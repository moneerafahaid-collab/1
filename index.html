<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>من الكود إلى المشروع — Git وGitHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f3efe6;
    --ink: #1c1916;
    --muted: #4e4942;
    --line: #ddd4c6;
    --card: #fffcf7;
    --pine: #0d6a56;
    --pine-soft: #e5f3ef;
    --copper: #7a3e18;
    --copper-soft: #f8efe6;
    --code: #221f1b;
    --code-text: #f4efe6;
    --danger: #7d2e2e;
    --danger-soft: #f8ecec;
    --top: 58px;
    --bottom: 62px;
  }
  * { box-sizing: border-box; }
  html { font-size: clamp(16px, 1.25vw, 20px); }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
    line-height: 1.65;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--pine); outline-offset: 2px; }
  a { color: var(--pine); }
  [hidden] { display: none !important; }
  h1, h2, h3, p { margin: 0; }
  h1 { font-size: clamp(1.7rem, 3vw, 2.35rem); line-height: 1.35; font-weight: 700; }
  h2 { font-size: 1.35rem; line-height: 1.4; font-weight: 700; }
  h3 { font-size: 1.05rem; line-height: 1.45; font-weight: 600; }

  .top, .bottom {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 18px;
    background: var(--card);
    border-color: var(--line);
    border-style: solid;
    z-index: 2;
  }
  .top { height: var(--top); border-width: 0 0 1px; justify-content: space-between; }
  .bottom { height: var(--bottom); border-width: 1px 0 0; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; }
  .mark {
    font-family: "IBM Plex Mono", Consolas, monospace;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    border: 1px solid var(--ink);
    padding: 2px 6px;
  }
  .top-actions, .bottom { display: flex; align-items: center; gap: 10px; }
  .section-label { color: var(--muted); font-size: 0.85rem; }
  .counter { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 4.5rem; text-align: center; }
  .ghost, .primary, .texty {
    border: 1px solid var(--line);
    background: transparent;
    padding: 7px 12px;
  }
  .primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .texty { border: 0; background: transparent; padding: 8px 4px; text-align: right; width: 100%; }
  button:disabled { opacity: 0.35; cursor: default; }
  .progress { flex: 1; height: 4px; background: var(--line); position: relative; }
  #bar { position: absolute; top: 0; right: 0; bottom: 0; width: 0; background: var(--pine); }
  .hint { color: var(--muted); font-size: 0.72rem; white-space: nowrap; }

  .stage-wrap { flex: 1; overflow: auto; }
  .slide { max-width: 1180px; margin: 0 auto; padding: 28px 32px 46px; }
  .kicker { color: var(--pine); font-weight: 600; font-size: 0.82rem; margin-bottom: 8px; }
  .lead { margin-top: 10px; color: var(--muted); font-size: 1.08rem; max-width: 46rem; }
  .idea {
    margin-top: 22px;
    max-width: 38rem;
    padding: 14px 16px;
    background: var(--pine-soft);
    border-inline-start: 3px solid var(--pine);
    font-weight: 600;
  }
  .cover { min-height: calc(100vh - var(--top) - var(--bottom) - 8px); display: flex; flex-direction: column; justify-content: space-between; }
  .cover h1 { font-size: clamp(2.3rem, 5vw, 3.6rem); max-width: 9em; line-height: 1.25; }
  .meta-row { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); margin-top: 28px; }
  .meta-row div { padding: 14px 14px 0 0; border-inline-start: 1px solid var(--line); }
  .meta-row div:first-child { border-inline-start: 0; padding-inline-start: 0; }
  .meta-row strong { display: block; font-size: 1.05rem; }
  .meta-row span { color: var(--muted); font-size: 0.88rem; }

  .trainer-flag {
    max-width: 1180px;
    margin: 0 auto;
    padding: 10px 32px 0;
    color: var(--copper);
    font-size: 0.85rem;
    font-weight: 700;
  }
  .callout {
    margin-top: 16px;
    padding: 12px 14px;
    background: var(--pine-soft);
    border-inline-start: 3px solid var(--pine);
  }
  .ask {
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
    font-weight: 600;
  }
  .ask span { display: inline-block; margin-inline-end: 8px; color: var(--pine); font-size: 0.82rem; }
  .ex-label { color: var(--copper); font-weight: 700; font-size: 0.82rem; margin-inline-end: 6px; }
  .example {
    margin-top: 14px;
    padding: 12px 14px;
    background: var(--copper-soft);
    border-inline-start: 3px solid var(--copper);
  }
  .example p + p { margin-top: 6px; }

  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 28px; margin-top: 18px; }
  .cols.three { grid-template-columns: repeat(3, 1fr); }
  .point { padding: 11px 0; border-bottom: 1px solid var(--line); }
  .point p, .step p { color: var(--muted); margin-top: 3px; }
  .point .ex, .step .ex { color: var(--ink); }

  .steps { list-style: none; padding: 0; margin: 18px 0 0; }
  .steps li { display: grid; grid-template-columns: 36px 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .num {
    width: 28px; height: 28px; display: grid; place-items: center;
    border: 1px solid var(--ink); font-size: 0.82rem; font-weight: 700;
  }

  table { width: 100%; border-collapse: collapse; margin-top: 18px; }
  th, td { text-align: right; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-size: 0.82rem; font-weight: 600; }
  td:last-child, th:last-child { background: var(--copper-soft); }

  .agenda { margin-top: 8px; }
  .agenda-row {
    width: 100%;
    display: grid;
    grid-template-columns: 108px 180px 1fr;
    gap: 12px;
    padding: 11px 8px;
    background: transparent;
    border: 0;
    border-bottom: 1px solid var(--line);
    text-align: right;
  }
  .agenda-row:hover, .pick:hover, .menu-item:hover { background: var(--pine-soft); }
  .agenda-row strong { font-weight: 600; }
  .when { color: var(--pine); font-variant-numeric: tabular-nums; font-weight: 600; }

  .explorer { display: grid; grid-template-columns: 300px 1fr; gap: 18px; margin-top: 16px; align-items: start; }
  .explorer-list { border: 1px solid var(--line); max-height: min(520px, 58vh); overflow: auto; background: var(--card); }
  .pick {
    display: flex; flex-direction: column; gap: 2px;
    width: 100%; text-align: right;
    padding: 10px 12px;
    border: 0; border-bottom: 1px solid var(--line);
    background: transparent;
  }
  .pick.on { background: var(--pine-soft); }
  .pick-title { font-weight: 600; }
  .pick-role { color: var(--muted); font-size: 0.82rem; }
  .detail { padding: 4px 4px 0 0; }
  .detail .lead { margin-top: 6px; }

  pre {
    margin: 10px 0 0;
    padding: 12px 14px;
    background: var(--code);
    color: var(--code-text);
    font-family: "IBM Plex Mono", Consolas, monospace;
    font-size: 0.82rem;
    line-height: 1.6;
    direction: ltr;
    text-align: left;
    white-space: pre-wrap;
    overflow: auto;
  }
  pre.doc { background: var(--card); color: var(--ink); direction: rtl; text-align: right; border: 1px solid var(--line); }
  .window-label {
    margin-top: 12px;
    font-family: "IBM Plex Mono", Consolas, monospace;
    font-size: 0.75rem;
    color: var(--muted);
  }
  .names { display: grid; gap: 8px; margin-top: 18px; max-width: 28rem; }
  .names div { padding: 8px 12px; border: 1px solid var(--line); background: var(--card); font-family: "IBM Plex Mono", Consolas, monospace; direction: ltr; text-align: left; }

  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 18px; }
  .panel { padding: 14px 16px 6px; border: 1px solid var(--line); background: var(--card); }
  .panel h2 { margin-bottom: 4px; }

  .tree {
    margin-top: 12px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    background: var(--card);
    font-family: "IBM Plex Mono", Consolas, monospace;
    font-size: 0.86rem;
    direction: ltr;
    text-align: left;
    line-height: 1.7;
  }

  .quiz-top { display: flex; justify-content: space-between; gap: 12px; margin-top: 16px; color: var(--muted); }
  .dots { display: flex; gap: 5px; flex-wrap: wrap; }
  .dots i { width: 8px; height: 8px; background: var(--line); display: block; }
  .dots i.on { background: var(--pine); }
  .answer { margin-top: 14px; }

  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
  .pair .panel h2 { font-size: 1.05rem; }
  .diff-add { background: var(--pine-soft); }
  .diff-del { background: var(--danger-soft); }
  .line { padding: 4px 8px; font-family: "IBM Plex Mono", Consolas, monospace; font-size: 0.84rem; direction: ltr; text-align: left; }

  .phrase { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .phrase p { margin-top: 4px; }

  .checks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 16px; align-items: start; }
  .check {
    display: flex; gap: 8px; align-items: flex-start;
    width: 100%; text-align: right;
    padding: 7px 0;
    border: 0; border-bottom: 1px solid var(--line);
    background: transparent;
  }
  .box { width: 16px; height: 16px; border: 1px solid var(--ink); flex: none; margin-top: 4px; }
  .check.on .box { background: var(--pine); border-color: var(--pine); }
  .check.on span { color: var(--muted); text-decoration: line-through; }

  .links { margin-top: 8px; }
  .links a { display: block; padding: 12px 0; border-bottom: 1px solid var(--line); text-decoration: none; }
  .links a strong { display: block; color: var(--ink); }
  .links a span { color: var(--muted); font-size: 0.92rem; }

  .overlay { position: fixed; inset: 0; background: rgba(28, 25, 22, 0.4); z-index: 5; }
  .drawer {
    position: absolute; top: 0; bottom: 0; right: 0;
    width: min(400px, 100%);
    background: var(--card);
    border-left: 1px solid var(--line);
    overflow: auto;
    padding: 16px 14px 28px;
  }
  .menu-sec { margin: 14px 8px 4px; color: var(--pine); font-size: 0.78rem; font-weight: 700; }
  .menu-item.on { background: var(--pine-soft); }
  .notes {
    position: fixed;
    left: 16px; right: 16px; bottom: calc(var(--bottom) + 10px);
    background: var(--ink); color: var(--paper);
    padding: 14px 16px;
    z-index: 4;
  }
  .notes-label { color: #c9c1b4; font-size: 0.75rem; font-weight: 700; margin-bottom: 4px; }
  .row-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .choice {
    display: block;
    width: 100%;
    text-align: right;
    margin-top: 8px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    background: var(--card);
  }
  .choice.right { background: var(--pine-soft); border-color: var(--pine); }
  .choice.wrong { background: var(--danger-soft); border-color: var(--danger); }
  .choice:disabled { opacity: 1; cursor: default; }
  .turn {
    display: inline-block;
    margin-bottom: 8px;
    padding: 2px 8px;
    border: 1px solid var(--pine);
    color: var(--pine);
    font-weight: 700;
    font-size: 0.82rem;
  }

  @media (min-width: 901px) {
  ol.steps.dense {
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 32px;
  }
}
@media (max-width: 900px) {
    .cols, .cols.three, .split, .pair, .checks, .explorer { grid-template-columns: 1fr; }
    .meta-row { grid-template-columns: 1fr 1fr; }
    .meta-row div { border-inline-start: 0; padding: 12px 10px 0 0; border-top: 1px solid var(--line); }
    .meta-row div:nth-child(-n + 2) { border-top: 0; padding-top: 0; }
    .agenda-row { grid-template-columns: 1fr; gap: 2px; }
    .hint { display: none; }
    .explorer-list { max-height: 210px; }
    .slide { padding: 20px 16px 32px; }
    .trainer-flag { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark">Git</span><span>من الكود إلى المشروع</span></div>
  <div class="top-actions">
    <span class="section-label" id="section-label"></span>
    <span class="counter" id="counter" dir="ltr"></span>
    <button class="ghost" id="menu-btn" data-action="menu" type="button">القائمة</button>
  </div>
</header>
<div class="stage-wrap" id="stage-wrap">
  <main id="stage" aria-live="polite"></main>
</div>
<footer class="bottom">
  <button class="ghost" id="prev" data-action="prev" type="button">السابق</button>
  <div class="progress" aria-hidden="true"><div id="bar"></div></div>
  <span class="hint">التالي: سهم يسار · السابق: سهم يمين · M القائمة · F ملء الشاشة</span>
  <button class="primary" id="next" data-action="next" type="button">التالي</button>
</footer>
<div id="menu" class="overlay" hidden>
  <div class="drawer">
    <div class="brand"><span class="mark">Git</span><span>محتوى الورشة</span></div>
    <div id="menu-list"></div>
  </div>
</div>
<noscript><p style="padding:24px">هذا العرض يحتاج تفعيل JavaScript في المتصفح.</p></noscript>

function esc(s) {
  return String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}
function exampleBox(text, code) {
  if (!text && !code) return "";
  return `<aside class="example"><p><span class="ex-label">مثال</span>${text ? esc(text) : ""}</p>${code ? `<pre>${esc(code)}</pre>` : ""}</aside>`;
}
function pointsHtml(items) {
  return items.map((item) => `

      ${item.text ? `<p>${esc(item.text)}</p>` : ""}
      ${item.example ? `<p class="ex"><span class="ex-label">مثال</span>${esc(item.example)}</p>` : ""}
      ${item.code ? `<pre>${esc(item.code)}</pre>` : ""}

}
function askHtml(q) {
  return q ? `<p class="ask"><span>سؤال لكم</span>${esc(q)}</p>` : "";
}
function calloutHtml(text) {
  return text ? `<div class="callout">${esc(text)}</div>` : "";
}
function explorer(slideId, items, detail) {
  const current = items.find((item) => item.key === ui.selected[slideId]) || items[0];

      <span class="pick-role">${esc(item.role || "")}</span>

  return `<div class="explorer"><div class="explorer-list">${list}</div><div class="detail">${detail(current)}</div></div>`;
}

const ui = {
  revealed: {},
  selected: {},
  quiz: 0,
  quizPick: null,
  conflictStep: 0,
  checks: {}
};
let index = 0;

function current() { return slides[index]; }

function renderMenu() {
  const groups = [];
  slides.forEach((slide) => {
    const last = groups[groups.length - 1];
    if (!last || last.section !== slide.section) groups.push({ section: slide.section, items: [slide] });
    else last.items.push(slide);
  });
  document.getElementById("menu-list").innerHTML = groups.map((group) => `
    <p class="menu-sec">${esc(group.section)}</p>
    ${group.items.map((slide) => `<button class="texty menu-item" type="button" data-action="goto" data-id="${slide.id}">${esc(slide.menu)}</button>`).join("")}
  `).join("");
}

function paint(options) {
  const slide = current();
  const keep = options && options.keepScroll;
  const wrap = document.getElementById("stage-wrap");
  const stageTop = wrap.scrollTop;
  const listTop = document.querySelector(".explorer-list") ? document.querySelector(".explorer-list").scrollTop : 0;
  const flag = slide.audience ? "" : `<p class="trainer-flag">شريحة للمدربة — لا تعرضيها على الحضور</p>`;
  const html = renderers[slide.type](slide);
  document.getElementById("stage").innerHTML = flag + html;
  document.getElementById("counter").textContent = (index + 1) + " / " + slides.length;
  document.getElementById("section-label").textContent = slide.section;
  document.getElementById("bar").style.width = (((index + 1) / slides.length) * 100) + "%";
  document.getElementById("prev").disabled = index === 0;
  document.getElementById("next").disabled = index === slides.length - 1;
  document.title = slide.menu + " — من الكود إلى المشروع";
  document.querySelectorAll(".menu-item").forEach((button) => {
    button.classList.toggle("on", button.dataset.id === slide.id);
  });
  if (keep) {
    wrap.scrollTop = stageTop;
    const list = document.querySelector(".explorer-list");
    if (list) list.scrollTop = listTop;
  } else {
    wrap.scrollTop = 0;
  }
  try { history.replaceState(null, "", "#" + slide.id); } catch (err) { /* ignore */ }
}

function go(next) {
  const max = slides.length - 1;
  index = Math.max(0, Math.min(max, next));
  try { sessionStorage.setItem("workshop-slide", String(index)); } catch (err) { /* ignore */ }
  paint();
}

function toggleMenu(force) {
  const menu = document.getElementById("menu");
  const open = typeof force === "boolean" ? force : menu.hasAttribute("hidden");
  menu.hidden = !open;
  document.getElementById("menu-btn").setAttribute("aria-expanded", open ? "true" : "false");
}
function toggleFull() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen().catch(() => {});
  }
}

function onClick(event) {
  if (event.target.id === "menu") { toggleMenu(false); return; }
  const button = event.target.closest("[data-action]");
  if (!button) return;
  const action = button.dataset.action;
  if (action === "next") go(index + 1);
  else if (action === "prev") go(index - 1);
  else if (action === "menu") toggleMenu();
  else if (action === "full") toggleFull();
  else if (action === "goto") {
    const found = slides.findIndex((slide) => slide.id === button.dataset.id);
    if (found >= 0) { toggleMenu(false); go(found); }
  } else if (action === "reveal") {
    ui.revealed[current().id] = true;
    paint({ keepScroll: true });
  } else if (action === "pick") {
    ui.selected[current().id] = button.dataset.key;
    paint({ keepScroll: true });
  } else if (action === "quiz-pick") {
    ui.quizPick = Number(button.dataset.choice);
    paint({ keepScroll: true });
  } else if (action === "quiz-next") {
    ui.quiz = Math.min(QUESTIONS.length - 1, ui.quiz + 1);
    ui.quizPick = null;
    paint({ keepScroll: true });
  } else if (action === "quiz-prev") {
    ui.quiz = Math.max(0, ui.quiz - 1);
    ui.quizPick = null;
    paint({ keepScroll: true });
  } else if (action === "conflict-next") {
    ui.conflictStep = Math.min(2, ui.conflictStep + 1);
    paint({ keepScroll: true });
  } else if (action === "conflict-reset") {
    ui.conflictStep = 0;
    paint({ keepScroll: true });
  } else if (action === "check") {
    const id = button.dataset.id;
    ui.checks[id] = !ui.checks[id];
    try { localStorage.setItem("workshop-checks", JSON.stringify(ui.checks)); } catch (err) { /* ignore */ }
    button.classList.toggle("on", ui.checks[id]);
    button.setAttribute("aria-pressed", ui.checks[id] ? "true" : "false");
    const count = document.getElementById("check-count");
    if (count) count.textContent = CHECKS.filter((item) => ui.checks[item.id]).length + " / " + CHECKS.length;
  } else if (action === "copy") {
    navigator.clipboard.writeText(README_TEXT).then(() => {
      button.textContent = "تم النسخ";
    }).catch(() => {
      button.textContent = "انسخ النص من المربع";
    });
  }
}

document.body.addEventListener("click", onClick);
document.addEventListener("keydown", (event) => {
  if (event.altKey || event.ctrlKey || event.metaKey) return;
  const typing = document.activeElement && document.activeElement.tagName === "INPUT";
  if (typing) return;
  if (event.key === "Escape") {
    toggleMenu(false);
    return;
  }
  if (event.code === "KeyM") { toggleMenu(); event.preventDefault(); return; }
  if (event.code === "KeyF") { toggleFull(); event.preventDefault(); return; }
  const forward = event.key === "ArrowLeft" || event.key === "ArrowDown" || event.key === "PageDown";
  const back = event.key === "ArrowRight" || event.key === "ArrowUp" || event.key === "PageUp";
  if (event.code === "Space") {
    if (document.activeElement && document.activeElement.tagName === "BUTTON") return;
    go(index + 1);
    event.preventDefault();
    return;
  }
  if (forward) { go(index + 1); event.preventDefault(); }
  else if (back) { go(index - 1); event.preventDefault(); }
  else if (event.key === "Home") { go(0); }
  else if (event.key === "End") { go(slides.length - 1); }
});

document.getElementById("stage-wrap").addEventListener("touchstart", (event) => {
  if (event.target.closest("pre, .explorer-list")) return;
  ui.touchX = event.changedTouches[0].clientX;
}, { passive: true });
document.getElementById("stage-wrap").addEventListener("touchend", (event) => {
  if (ui.touchX == null) return;
  const dx = event.changedTouches[0].clientX - ui.touchX;
  ui.touchX = null;
  if (Math.abs(dx) < 70) return;
  if (dx < 0) go(index + 1);
  else go(index - 1);
}, { passive: true });

try {
  ui.checks = JSON.parse(localStorage.getItem("workshop-checks") || "{}");
} catch (err) { ui.checks = {}; }
const hash = location.hash.replace("#", "");
const hashIndex = slides.findIndex((slide) => slide.id === hash);
if (hashIndex >= 0) index = hashIndex;
else {
  try {
    const saved = Number(sessionStorage.getItem("workshop-slide"));
    if (saved >= 0 && saved < slides.length) index = saved;
  } catch (err) { /* ignore */ }
}
renderMenu();
paint();
</script>
</body>
</html>
